name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Juvia ${{ github.ref_name }}
          draft: false
          prerelease: false

  build:
    name: Build Package
    needs: create_release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Copy frontend to embed directory
        run: |
          mkdir -p internal/web
          rm -rf internal/web/dist
          cp -r web/dist internal/web/dist

      - name: Build DEB package
        run: |
          chmod +x scripts/build-deb.sh
          mkdir -p /tmp/juvia-build-$$
          ARCH=amd64 VERSION=${GITHUB_REF#refs/tags/v} bash scripts/build-deb.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload DEB package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: juvia_${{ github.ref_name }}_amd64.deb
          asset_name: juvia_${{ github.ref_name }}_amd64.deb
          asset_content_type: application/vnd.debian.binary-package