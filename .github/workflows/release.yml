name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Copy frontend to embed directory
        run: |
          mkdir -p internal/web
          rm -rf internal/web/dist
          cp -r web/dist internal/web/dist

      - name: Build DEB package
        id: build
        run: |
          chmod +x scripts/build-deb.sh
          VERSION_STR="${GITHUB_REF_NAME#v}"
          bash scripts/build-deb.sh "${VERSION_STR}" amd64
          echo "deb_file=juvia_${VERSION_STR}_amd64.deb" >> $GITHUB_OUTPUT

      - name: Upload DEB package
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: ${{ steps.build.outputs.deb_file }}
          artifactContentType: application/vnd.debian.binary-package
          token: ${{ secrets.GITHUB_TOKEN }}